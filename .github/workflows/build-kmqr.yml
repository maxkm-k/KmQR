name: Build KmQR App (All-in-One)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-kmqr:
    name: Scaffold & Build KmQR APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools-version: "36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: "stable"
          cache: true

      - name: Scaffold Flutter project if not present
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            flutter create --org com.kmqr --project-name kmqr .
          fi

      - name: Configure dependencies, Android SDK & permissions
        run: |
          flutter pub add qr_flutter mobile_scanner shared_preferences share_plus path_provider

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <application/' "$MANIFEST"
          fi

          for GRADLE_FILE in "android/app/build.gradle" "android/app/build.gradle.kts"; do
            if [ -f "$GRADLE_FILE" ]; then
              sed -i -E 's/(compileSdk(Version)?[[:space:]]*(=)?[[:space:]]*)(flutter\.compileSdkVersion\(\)|flutter\.compileSdkVersion|[0-9]+)/\136/g' "$GRADLE_FILE"
              sed -i -E 's/(targetSdk(Version)?[[:space:]]*(=)?[[:space:]]*)(flutter\.targetSdkVersion\(\)|flutter\.targetSdkVersion|[0-9]+)/\136/g' "$GRADLE_FILE"
              sed -i -E 's/(minSdk(Version)?[[:space:]]*(=)?[[:space:]]*)(flutter\.minSdkVersion\(\)|flutter\.minSdkVersion|[0-9]+)/\121/g' "$GRADLE_FILE"
            fi
          done

      - name: Write KmQR application code (lib/main.dart)
        run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:io';
          import 'dart:ui' as ui;
          import 'package:flutter/material.dart';
          import 'package:flutter/rendering.dart';
          import 'package:flutter/services.dart';
          import 'package:mobile_scanner/mobile_scanner.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:qr_flutter/qr_flutter.dart';
          import 'package:share_plus/share_plus.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const KmQRApp());
          }

          class KmQRApp extends StatelessWidget {
            const KmQRApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'KmQR',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.indigo),
                  useMaterial3: true,
                ),
                home: const KmQRHome(),
              );
            }
          }

          class QrHistoryItem {
            final String id;
            final String text;
            final String createdAt;

            QrHistoryItem({
              required this.id,
              required this.text,
              required this.createdAt,
            });

            Map<String, dynamic> toMap() => {
                  'id': id,
                  'text': text,
                  'createdAt': createdAt,
                };

            factory QrHistoryItem.fromMap(Map<String, dynamic> map) => QrHistoryItem(
                  id: map['id'] as String,
                  text: map['text'] as String,
                  createdAt: map['createdAt'] as String,
                );
          }

          class KmQRHome extends StatefulWidget {
            const KmQRHome({super.key});

            @override
            State<KmQRHome> createState() => _KmQRHomeState();
          }

          class _KmQRHomeState extends State<KmQRHome> {
            static const _storageKey = 'kmqr_history_v1';

            int _selectedIndex = 0;
            final TextEditingController _textController = TextEditingController();
            final GlobalKey _qrBoundaryKey = GlobalKey();
            String? _activeQrData;
            List<QrHistoryItem> _history = [];
            String? _scannedText;
            bool _scanHandled = false;

            @override
            void initState() {
              super.initState();
              _loadHistory();
            }

            @override
            void dispose() {
              _textController.dispose();
              super.dispose();
            }

            Future<void> _loadHistory() async {
              final prefs = await SharedPreferences.getInstance();
              final raw = prefs.getStringList(_storageKey) ?? [];
              setState(() {
                _history = raw
                    .map((e) => QrHistoryItem.fromMap(jsonDecode(e) as Map<String, dynamic>))
                    .toList();
              });
            }

            Future<void> _saveHistory() async {
              final prefs = await SharedPreferences.getInstance();
              final encoded = _history.map((item) => jsonEncode(item.toMap())).toList();
              await prefs.setStringList(_storageKey, encoded);
            }

            Future<void> _generateQr() async {
              final input = _textController.text.trim();
              if (input.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Please enter or paste text first.')),
                );
                return;
              }

              final item = QrHistoryItem(
                id: DateTime.now().microsecondsSinceEpoch.toString(),
                text: input,
                createdAt: DateTime.now().toLocal().toString().split('.').first,
              );

              setState(() {
                _activeQrData = input;
                _history.insert(0, item);
              });

              await _saveHistory();
            }

            Future<File?> _renderQrToPngFile({bool permanent = false}) async {
              try {
                final boundary = _qrBoundaryKey.currentContext?.findRenderObject()
                    as RenderRepaintBoundary?;
                if (boundary == null) return null;

                final ui.Image image = await boundary.toImage(pixelRatio: 3.0);
                final ByteData? byteData =
                    await image.toByteData(format: ui.ImageByteFormat.png);
                if (byteData == null) return null;

                final Uint8List pngBytes = byteData.buffer.asUint8List();
                final dir = permanent
                    ? (await getExternalStorageDirectory() ??
                        await getApplicationDocumentsDirectory())
                    : await getTemporaryDirectory();

                final fileName = 'KmQR_${DateTime.now().millisecondsSinceEpoch}.png';
                final file = File('${dir.path}/$fileName');
                await file.writeAsBytes(pngBytes);
                return file;
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text('Failed to render QR image: $e')),
                  );
                }
                return null;
              }
            }

            Future<void> _exportQrImage() async {
              final file = await _renderQrToPngFile(permanent: true);
              if (file == null || !mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text('Exported PNG to: ${file.path}')),
              );
            }

            Future<void> _shareQrImage() async {
              final file = await _renderQrToPngFile(permanent: false);
              if (file == null) return;
              await SharePlus.instance.share(
                ShareParams(
                  files: [XFile(file.path)],
                  text: _activeQrData ?? 'KmQR Code',
                ),
              );
            }

            Future<void> _deleteHistoryItem(String id) async {
              setState(() {
                _history.removeWhere((item) => item.id == id);
              });
              await _saveHistory();
            }

            Future<void> _copyToClipboard(String text) async {
              await Clipboard.setData(ClipboardData(text: text));
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(content: Text('Text copied to clipboard')),
              );
            }

            Widget _buildGenerateTab() {
              return SingleChildScrollView(
                padding: const EdgeInsets.all(16),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    TextField(
                      controller: _textController,
                      maxLines: 4,
                      decoration: const InputDecoration(
                        labelText: 'Enter or paste text',
                        hintText: 'Type message, link, or notes to turn into a QR code...',
                        border: OutlineInputBorder(),
                      ),
                    ),
                    const SizedBox(height: 12),
                    FilledButton.icon(
                      onPressed: _generateQr,
                      icon: const Icon(Icons.qr_code_2),
                      label: const Text('Generate QR'),
                    ),
                    const SizedBox(height: 24),
                    if (_activeQrData != null) ...[
                      Center(
                        child: RepaintBoundary(
                          key: _qrBoundaryKey,
                          child: Container(
                            padding: const EdgeInsets.all(16),
                            decoration: BoxDecoration(
                              color: Colors.white,
                              borderRadius: BorderRadius.circular(12),
                              boxShadow: const [
                                BoxShadow(blurRadius: 8, color: Colors.black12),
                              ],
                            ),
                            child: QrImageView(
                              data: _activeQrData!,
                              version: QrVersions.auto,
                              backgroundColor: Colors.white,
                              size: 220,
                            ),
                          ),
                        ),
                      ),
                      const SizedBox(height: 16),
                      Row(
                        children: [
                          Expanded(
                            child: OutlinedButton.icon(
                              onPressed: _exportQrImage,
                              icon: const Icon(Icons.download),
                              label: const Text('Export PNG'),
                            ),
                          ),
                          const SizedBox(width: 12),
                          Expanded(
                            child: FilledButton.tonalIcon(
                              onPressed: _shareQrImage,
                              icon: const Icon(Icons.share),
                              label: const Text('Share QR'),
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 12),
                      Text(
                        _activeQrData!,
                        textAlign: TextAlign.center,
                        style: Theme.of(context).textTheme.bodyMedium,
                      ),
                    ],
                  ],
                ),
              );
            }

            Widget _buildScanTab() {
              return Column(
                children: [
                  Expanded(
                    flex: 3,
                    child: MobileScanner(
                      onDetect: (capture) {
                        if (_scanHandled) return;
                        final value = capture.barcodes.firstOrNull?.rawValue;
                        if (value != null && value.isNotEmpty) {
                          setState(() {
                            _scanHandled = true;
                            _scannedText = value;
                          });
                        }
                      },
                    ),
                  ),
                  Expanded(
                    flex: 2,
                    child: Container(
                      width: double.infinity,
                      padding: const EdgeInsets.all(16),
                      child: _scannedText == null
                          ? const Center(
                              child: Text('Point camera at a QR code on another screen'),
                            )
                          : Column(
                              crossAxisAlignment: CrossAxisAlignment.stretch,
                              children: [
                                const Text(
                                  'Scanned Text:',
                                  style: TextStyle(fontWeight: FontWeight.bold),
                                ),
                                const SizedBox(height: 6),
                                Expanded(
                                  child: SingleChildScrollView(
                                    child: SelectableText(_scannedText!),
                                  ),
                                ),
                                const SizedBox(height: 8),
                                Row(
                                  children: [
                                    Expanded(
                                      child: FilledButton.icon(
                                        onPressed: () => _copyToClipboard(_scannedText!),
                                        icon: const Icon(Icons.copy),
                                        label: const Text('Copy Text'),
                                      ),
                                    ),
                                    const SizedBox(width: 8),
                                    OutlinedButton(
                                      onPressed: () {
                                        setState(() {
                                          _scannedText = null;
                                          _scanHandled = false;
                                        });
                                      },
                                      child: const Text('Scan Again'),
                                    ),
                                  ],
                                ),
                              ],
                            ),
                    ),
                  ),
                ],
              );
            }

            Widget _buildHistoryTab() {
              if (_history.isEmpty) {
                return const Center(
                  child: Text('No saved QR codes yet. Generated items stay here until deleted.'),
                );
              }

              return ListView.separated(
                itemCount: _history.length,
                separatorBuilder: (_, __) => const Divider(height: 1),
                itemBuilder: (context, index) {
                  final item = _history[index];
                  return ListTile(
                    leading: const Icon(Icons.qr_code),
                    title: Text(
                      item.text,
                      maxLines: 2,
                      overflow: TextOverflow.ellipsis,
                    ),
                    subtitle: Text(item.createdAt),
                    onTap: () {
                      setState(() {
                        _textController.text = item.text;
                        _activeQrData = item.text;
                        _selectedIndex = 0;
                      });
                    },
                    trailing: IconButton(
                      icon: const Icon(Icons.delete_outline, color: Colors.red),
                      tooltip: 'Delete',
                      onPressed: () => _deleteHistoryItem(item.id),
                    ),
                  );
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              final tabs = [
                _buildGenerateTab(),
                _buildScanTab(),
                _buildHistoryTab(),
              ];

              return Scaffold(
                appBar: AppBar(
                  title: const Text('KmQR'),
                  centerTitle: true,
                ),
                body: tabs[_selectedIndex],
                bottomNavigationBar: NavigationBar(
                  selectedIndex: _selectedIndex,
                  onDestinationSelected: (idx) {
                    setState(() {
                      _selectedIndex = idx;
                      if (idx == 1) {
                        _scanHandled = false;
                      }
                    });
                  },
                  destinations: const [
                    NavigationDestination(
                      icon: Icon(Icons.qr_code_2),
                      label: 'Generate',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.qr_code_scanner),
                      label: 'Scan',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.history),
                      label: 'History',
                    ),
                  ],
                ),
              );
            }
          }
          EOF

          mkdir -p test
          cat << 'EOF' > test/widget_test.dart
          import 'package:flutter_test/flutter_test.dart';
          import 'package:kmqr/main.dart';

          void main() {
            testWidgets('KmQR renders Generate tab', (WidgetTester tester) async {
              await tester.pumpWidget(const KmQRApp());
              expect(find.text('KmQR'), findsOneWidget);
              expect(find.text('Generate QR'), findsOneWidget);
            });
          }
          EOF

      - name: Get packages & analyze
        run: |
          flutter pub get
          flutter analyze

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload KmQR APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kmqr-android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
